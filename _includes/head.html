<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#ffffff">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<meta name="googlebot" content="index, follow">
<meta name="application-name" content="Easy Mail Merge">
<title>{{ page.title | default: site.title }}</title>
<!-- Preload CSS -->
<link rel="preload" href="/assets/css/bootstrap.min.css" as="style">
<link rel="preload" href="/assets/css/style.css" as="style">
<!-- CSS -->
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<!-- Favicon -->
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="shortcut icon" href="assets/images/favicon.ico" type="image/x-icon">
<!-- CSP optional -->
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
<!-- Google Fonts -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Apple Touch Icon -->
<link rel="apple-touch-icon" href="{{'/assets/images/apple-touch-icon.png' | relative_url }}">
<meta name="apple-mobile-web-app-title" content="Easy Mail Merge">
<meta name="apple-mobile-web-app-capable" content="yes">

<!-- for other features refer to https://www.w3.org/wiki/WebSchemas/Accessibility -->
<meta itemprop="accessibilityFeature" content="highContrastDisplay" />
<meta itemprop="accessibilityFeature" content="fullKeyboardControl" />
<meta itemprop="accessibilityFeature" content="fullMouseControl" />
<meta itemprop="accessibilityFeature" content="fullTouchControl" />
{% seo title=false %}
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>
