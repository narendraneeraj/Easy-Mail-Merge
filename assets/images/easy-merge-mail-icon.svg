<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A9BFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1877F2;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1877F2" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Sharp square icon background (no rounded corners) -->
  <rect x="25" y="25" width="450" height="450" fill="url(#bgGrad)" filter="url(#softShadow)"/>

  <!-- Subtle highlight circles -->
  <circle cx="120" cy="120" r="100" fill="#ffffff" opacity="0.08"/>
  <circle cx="390" cy="400" r="120" fill="#ffffff" opacity="0.06"/>

  <!-- Envelope (positioned in upper area) -->
  <g transform="translate(250, 200)">
    <!-- Envelope body (white outline) -->
    <rect x="-110" y="-72" width="220" height="144" rx="20" ry="20" fill="none" stroke="#ffffff" stroke-width="6"/>

    <!-- Envelope flap (white V) -->
    <path d="M-107,-52 L0,20 L107,-52" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Send button (bottom right) -->
    <g transform="translate(85, 50)">
      <circle cx="0" cy="0" r="28" fill="#ffffff"/>
      <path d="M-11,-11 L13,0 L-11,11 L-8,0 Z" fill="#1877F2"/>
    </g>
  </g>

  <!-- Campaign megaphone on top of envelope (half in, half out) -->
  <g transform="translate(250, 95)">
    <circle cx="0" cy="0" r="44" fill="#1877F2"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#ffffff" stroke-width="5"/>

    <g transform="translate(0, 0) rotate(-20)">
      <path d="M-24,-14 L9,-27 L9,27 L-24,14 Z" fill="#ffffff"/>
      <rect x="-29" y="-5" width="10" height="10" rx="2" fill="#ffffff"/>
      <path d="M14,-20 Q24,-10 24,0 Q24,10 14,20" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M21,-29 Q36,-14 36,0 Q36,14 21,29" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.65"/>
    </g>
  </g>

  <!-- Decorative dots -->
  <circle cx="110" cy="110" r="4" fill="#ffffff" opacity="0.5"/>
  <circle cx="130" cy="95" r="2.5" fill="#ffffff" opacity="0.35"/>
  <circle cx="95" cy="130" r="2" fill="#ffffff" opacity="0.25"/>
  <circle cx="390" cy="390" r="4" fill="#ffffff" opacity="0.5"/>
  <circle cx="375" cy="410" r="2.5" fill="#ffffff" opacity="0.35"/>
  <circle cx="410" cy="375" r="2" fill="#ffffff" opacity="0.25"/>

  <!-- Brand text in white inside icon -->
  <text x="250" y="375" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" letter-spacing="0.5">
    Easy Mail Merge
  </text>
</svg>